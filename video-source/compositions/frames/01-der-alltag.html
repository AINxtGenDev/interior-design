<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 1 — Der Alltag</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family:"Manrope"; src:url("assets/fonts/Manrope-var.woff2") format("woff2"); font-weight:200 800; font-style:normal; font-display:block; }
        @font-face { font-family:"Montserrat"; src:url("assets/fonts/Montserrat-400.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:block; }

        #root { position:absolute; inset:0; overflow:hidden; }
        /* Full-bleed child carries the fill — never the composition root. */
        #f1-bg { position:absolute; inset:0; background:#f3eee8; }

        /* Change 2026-10-09: two lines above the wardrobe, one sentence below.
           The whole block is centred on the true frame centre (540/960) by flex,
           so it stays centred whatever the lines wrap to. Block height ~1300px:
           top ~310, bottom ~1610 — inside the 8 % / 15 % keep-out. */
        #f1-stack {
          position:absolute; inset:0;
          display:flex; flex-direction:column; align-items:center; justify-content:center;
        }
        /* The website plays the film ~295 CSS px wide on a phone (scale ~0.27):
           70px lands at ~19 CSS px there, ~14 px on an iPhone SE (216 px), 23 px on desktop (360 px). */
        .f1-text {
          width:960px; margin:0; text-align:center; text-wrap:balance;
          font-family:"Manrope", system-ui, sans-serif;
          font-weight:500; font-size:70px; line-height:1.25; letter-spacing:-0.005em;
          color:#333338;
        }
        .f1-line { display:block; opacity:0; }

        #f1-photo {
          width:820px; height:860px; margin:44px 0;
          overflow:hidden; opacity:0; flex:none;
        }
        #f1-photo img { display:block; width:100%; height:100%; object-fit:cover; object-position:50% 40%; }
      </style>

      <div
        id="root"
        data-composition-id="01-der-alltag"
        data-width="1080"
        data-height="1920"
        data-duration="7.5"
      >
        <div id="f1-bg"></div>

        <div id="f1-stack">
          <p class="f1-text">
            <span class="f1-line" id="f1-line1">Der Schrank ist voll.</span>
            <span class="f1-line" id="f1-line2">Der Tisch auch.</span>
          </p>
          <div id="f1-photo" data-layout-allow-overflow><img id="f1-img" src="assets/schrank-unaufgeraeumt.webp" alt="" /></div>
          <p class="f1-text">
            <span class="f1-line" id="f1-line3">Und am Wochenende reicht die Zeit nur fürs Nachräumen.</span>
          </p>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          // The picture is there first: the viewer sees the mess before it is named.
          tl.fromTo("#f1-photo", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.0);
          // A slow 4% push-in under the whole frame; nothing else moves the photo.
          tl.fromTo("#f1-img", { scale: 1 }, { scale: 1.04, duration: 7.5, ease: "none" }, 0);

          // Each line lands on the word that names it in the VO — never all at t=0.
          tl.fromTo("#f1-line1", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, 0.30);
          tl.fromTo("#f1-line2", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, 1.90);
          tl.fromTo("#f1-line3", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, 3.10);

          // The signature hairline no longer draws here — the picture fills its old
          // place at y=1180. It draws in at the start of Frame 2 instead.

          window.__timelines["01-der-alltag"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
