<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 1 — Der Alltag</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family:"Cormorant Garamond"; src:url("assets/fonts/CormorantGaramond-300.woff2") format("woff2"); font-weight:100 900; font-style:normal; font-display:block; }
        @font-face { font-family:"Inter"; src:url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight:100 900; font-style:normal; font-display:block; }
        @font-face { font-family:"Jost"; src:url("assets/fonts/Jost-400.woff2") format("woff2"); font-weight:100 900; font-style:normal; font-display:block; }

        #root { position:absolute; inset:0; overflow:hidden; }
        /* Full-bleed child carries the fill — never the composition root. */
        #f1-bg { position:absolute; inset:0; background:#f3eee8; }

        #f1-stack { position:absolute; left:140px; top:660px; width:800px; }
        .f1-line {
          display:block;
          margin:0 0 26px;
          font-family:"Cormorant Garamond", Georgia, serif;
          font-weight:400;
          font-size:66px;
          line-height:1.18;
          color:#333338;
          opacity:0;
        }
        #f1-line3 { margin-bottom:0; }

        #f1-rule {
          position:absolute; left:140px; top:1180px;
          width:800px; height:1px; background:#8fa37a;
          transform-origin:left center;
        }
      </style>

      <div
        id="root"
        data-composition-id="01-der-alltag"
        data-width="1080"
        data-height="1920"
        data-duration="7.5"
      >
        <div id="f1-bg"></div>

        <div id="f1-stack">
          <span class="f1-line" id="f1-line1">Der Schrank ist voll.</span>
          <span class="f1-line" id="f1-line2">Der Tisch auch.</span>
          <span class="f1-line" id="f1-line3">Und am Wochenende reicht die Zeit nur fürs Nachräumen.</span>
        </div>

        <div id="f1-rule"></div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          // Each line lands on the word that names it in the VO — never all at t=0.
          tl.fromTo("#f1-line1", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, 0.30);
          tl.fromTo("#f1-line2", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, 1.90);
          tl.fromTo("#f1-line3", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, 3.10);

          // The signature hairline draws in for the first time and becomes the film's spine.
          tl.fromTo("#f1-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, 3.30);

          // 4.1s → 7.5s is a deliberate held read. Nothing moves.
          window.__timelines["01-der-alltag"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
