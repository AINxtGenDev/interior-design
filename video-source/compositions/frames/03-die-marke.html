<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 3 — Die Marke</title>
  </head>
  <body>
    <template>
      <style>

        #root { position:absolute; inset:0; overflow:hidden; }
        /* Sage light (#EFF4EE), carried over from Frame 2 (change deck 8.10.26, slide 6). */
        #f3-bg { position:absolute; inset:0; background:#eff4ee; }

        /* The whole block moves as a unit under the held push-in. */
        #f3-lockup { position:absolute; left:0; top:0; width:1080px; height:1920px; }

        /* Claudia's portrait instead of the logo ("Ich bin Claudia Plessl").
           700 px wide, 1045x1207 source -> 808.5 px high; its lower edge sits
           32 px above the hairline, which rises from 1180 to 1120 to meet it. */
        #f3-portrait {
          position:absolute; left:190px; top:279.5px; width:700px; height:808.5px;
          overflow:hidden; opacity:0;
        }
        #f3-portrait img { display:block; width:100%; height:100%; object-fit:cover; }

        #f3-rule {
          position:absolute; left:140px; top:1180px;
          width:800px; height:1px; background:#8fa37a;
          transform-origin:center center;
        }
      </style>

      <div
        id="root"
        data-composition-id="03-die-marke"
        data-width="1080"
        data-height="1920"
        data-duration="6.5"
      >
        <div id="f3-bg"></div>

        <div id="f3-lockup">
          <div id="f3-portrait"><img id="f3-img" src="assets/portrait-claudia.webp" alt="" /></div>
          <div id="f3-rule"></div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          // The inherited hairline rises to become the portrait's baseline.
          tl.fromTo("#f3-rule", { y: 0 }, { y: -60, duration: 0.8, ease: "power2.out" }, 0.20);

          // "Schöne Räume" — the portrait settles in.
          tl.fromTo("#f3-portrait", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.30);
          tl.fromTo("#f3-img", { scale: 1.05 }, { scale: 1, duration: 1.4, ease: "power2.out" }, 0.30);

          // A very slow 2% push-in runs under the held read; nothing else moves.
          tl.fromTo("#f3-lockup", { scale: 1 }, { scale: 1.02, duration: 6.5, ease: "none" }, 0);

          window.__timelines["03-die-marke"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
