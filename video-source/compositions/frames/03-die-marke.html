<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 3 — Die Marke</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family:"Cormorant Garamond"; src:url("assets/fonts/CormorantGaramond-300.woff2") format("woff2"); font-weight:100 900; font-style:normal; font-display:block; }
        @font-face { font-family:"Inter"; src:url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight:100 900; font-style:normal; font-display:block; }
        @font-face { font-family:"Jost"; src:url("assets/fonts/Jost-400.woff2") format("woff2"); font-weight:100 900; font-style:normal; font-display:block; }

        #root { position:absolute; inset:0; overflow:hidden; }
        #f3-bg { position:absolute; inset:0; background:#f3eee8; }

        /* The whole lockup sits in one block so the held push-in moves it as a unit. */
        #f3-lockup { position:absolute; left:0; top:0; width:1080px; height:1920px; }

        #f3-mark {
          position:absolute; left:50%; top:420px;
          width:368px; height:auto;
          margin-left:-184px;
          opacity:0;
        }

        #f3-rule {
          position:absolute; left:140px; top:1180px;
          width:800px; height:1px; background:#8fa37a;
          transform-origin:center center;
        }

        #f3-name {
          position:absolute; left:0; top:820px; width:1080px;
          text-align:center;
          font-family:"Jost", Arial, sans-serif;
          font-weight:500; font-size:46px; letter-spacing:11px;
          color:#333338; text-transform:uppercase;
          opacity:0;
        }
        #f3-sub {
          position:absolute; left:0; top:900px; width:1080px;
          text-align:center;
          font-family:"Jost", Arial, sans-serif;
          font-weight:500; font-size:30px; letter-spacing:7px;
          color:#637a53; text-transform:uppercase;
          opacity:0;
        }
      </style>

      <div
        id="root"
        data-composition-id="03-die-marke"
        data-width="1080"
        data-height="1920"
        data-duration="6.5"
      >
        <div id="f3-bg"></div>

        <div id="f3-lockup">
          <img id="f3-mark" src="assets/logo-mark-2008c2fa.webp" alt="" />
          <div id="f3-rule"></div>
          <div id="f3-name">Claudia Plessl</div>
          <div id="f3-sub">Interior Design · Ordnungscoaching</div>
        </div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          // The inherited hairline rises to become the logo's baseline — the frame's spine move.
          tl.fromTo("#f3-rule", { y: 0 }, { y: -420, duration: 0.8, ease: "power2.out" }, 0.20);

          // The monogram lands on the rule: the lock-in moment.
          tl.fromTo("#f3-mark", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power2.out" }, 1.60);

          tl.fromTo("#f3-name", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, 3.00);
          tl.fromTo("#f3-sub", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, 3.35);

          // A very slow 2% push-in runs under the held read; nothing else moves.
          tl.fromTo("#f3-lockup", { scale: 1 }, { scale: 1.02, duration: 6.5, ease: "none" }, 0);

          window.__timelines["03-die-marke"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
