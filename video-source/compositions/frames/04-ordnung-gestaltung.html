<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 4 — Erst Ordnung, dann Gestaltung</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family:"Cormorant Garamond"; src:url("assets/fonts/CormorantGaramond-300.woff2") format("woff2"); font-weight:100 900; font-style:normal; font-display:block; }
        @font-face { font-family:"Inter"; src:url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight:100 900; font-style:normal; font-display:block; }
        @font-face { font-family:"Jost"; src:url("assets/fonts/Jost-400.woff2") format("woff2"); font-weight:100 900; font-style:normal; font-display:block; }

        #root { position:absolute; inset:0; overflow:hidden; }
        #f4-bg { position:absolute; inset:0; background:#f3eee8; }

        .f4-pane {
          position:absolute; top:460px; width:500px; height:940px;
          overflow:hidden;
        }
        #f4-pane-l { left:60px; }
        #f4-pane-r { left:520px; }
        .f4-pane img {
          display:block; width:100%; height:100%; object-fit:cover;
          opacity:0;
        }

        #f4-divider {
          position:absolute; left:540px; top:460px;
          width:1px; height:940px; background:#8fa37a;
          transform-origin:center center;
        }

        .f4-label {
          position:absolute; top:1450px; width:500px;
          text-align:center;
          font-family:"Jost", Arial, sans-serif;
          font-weight:500; font-size:32px; letter-spacing:8px;
          color:#4d6040; text-transform:uppercase;
          opacity:0;
        }
        #f4-label-l { left:60px; }
        #f4-label-r { left:520px; }

        #f4-close {
          position:absolute; left:0; top:1560px; width:1080px;
          text-align:center;
          font-family:"Cormorant Garamond", Georgia, serif;
          font-weight:400; font-size:56px; color:#333338;
          opacity:0;
        }
      </style>

      <div
        id="root"
        data-composition-id="04-ordnung-gestaltung"
        data-width="1080"
        data-height="1920"
        data-duration="9.7"
      >
        <div id="f4-bg"></div>

        <div class="f4-pane" id="f4-pane-l">
          <img id="f4-img-l" src="assets/offenes-regalsystem-mit-beschrifteten-bo.webp" alt="" />
        </div>
        <div class="f4-pane" id="f4-pane-r">
          <img id="f4-img-r" src="assets/wohnbereich-in-warmen-naturtnen-mit-sofa.webp" alt="" />
        </div>

        <div id="f4-divider"></div>

        <div class="f4-label" id="f4-label-l">Ordnung</div>
        <div class="f4-label" id="f4-label-r">Gestaltung</div>

        <div id="f4-close">Beides aus einer Hand.</div>
      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          // The hairline arrives standing: the split itself is the signature move.
          tl.fromTo("#f4-divider", { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power2.out" }, 0.0);

          // "zuerst Ordnung" — the left pane fills first. The right stays visibly empty.
          tl.fromTo("#f4-img-l", { scale: 1.06, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.1, ease: "power2.out" }, 1.20);
          tl.fromTo("#f4-label-l", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 1.90);

          // "gestalte dann den Raum" — only now does the second half arrive.
          tl.fromTo("#f4-img-r", { scale: 1.06, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.1, ease: "power2.out" }, 3.90);
          tl.fromTo("#f4-label-r", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 4.60);

          // "Beides aus einer Hand." — the division contracts into a short joining stroke.
          tl.to("#f4-divider", { scaleY: 0.08, duration: 0.6, ease: "power2.out" }, 6.60);
          tl.to("#f4-label-l", { x: 60, duration: 0.6, ease: "power2.out" }, 6.60);
          tl.to("#f4-label-r", { x: -60, duration: 0.6, ease: "power2.out" }, 6.60);
          tl.fromTo("#f4-close", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 6.90);

          window.__timelines["04-ordnung-gestaltung"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
